<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Runner</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="asset/stylesheet/output.css">
</head>

<body>
    <div class="game-container" id="gameContainer">
        <div class="grid-floor">
            <div class="grid-lines"></div>
        </div>

        <div class="horizon-line"></div>

        <div class="player" id="player">
            <svg viewBox="0 0 60 70" width="100%" height="100%">
                <ellipse cx="30" cy="20" rx="15" ry="18" fill="#00ffff"></ellipse>

                <ellipse cx="24" cy="18" rx="4" ry="6" fill="#000"></ellipse>
                <ellipse cx="36" cy="18" rx="4" ry="6" fill="#000"></ellipse>

                <circle cx="25" cy="16" r="1.5" fill="#fff"></circle>
                <circle cx="37" cy="16" r="1.5" fill="#fff"></circle>

                <path d="M20 30 Q30 45 40 30 L40 50 L20 50 Z" fill="#00ffff" />
                <rect class="leg-left" x="22" y="48" width="6" height="15" rx="3" fill="#00ffff" />
                <rect class="leg-right" x="32" y="48" width="6" height="15" rx="3" fill="#00ffff" />
            </svg>
        </div>

        <div class="ui-stars"><i class="ri-star-fill"></i><span id="stars">0</span></div>
        <div class="ui-score">SCORE: <span id="score">0</span></div>
        <div class="ui-highscore">BEST: <span id="highScore">0</span></div>
        <div class="speed-up-text" id="speedUpText">SPEED UP!</div>

        <div class="overlay" id="startScreen">
            <h1>NEON RUNNER</h1>
            <h2>SPACE ALIEN EDITION</h2>
            <p>Press Space or click to jump<br>Collect stars and avoid the neon obstacles!</p>
            <button class="neon-btn" id="startBtn">START GAME</button>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <h1 style="color: #ff00ff; text-shadow: 0 0 20px #ff00ff;">GAME OVER</h1>
            <h2>SCORE: <span id="finalScore">0</span></h2>
            <p id="newRecordText" style="color: #ffeb3b; display: none;">NEW RECORD!</p>
            <button class="neon-btn" id="restartBtn">RESTART</button>
        </div>
    </div>
    <script src="asset/javascript/script.js"></script>
</body>

</html>
